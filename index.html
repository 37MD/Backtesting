<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE PWA Downloader</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #000000;
            background-color: #f0f0f0;
            margin: 15px;
        }
        h1, h2, h3, p, div, span, table, th, td, button, li {
            color: #000000;
        }
        #dashboard {
            border: 2px solid #000000;
            padding: 15px;
            background-color: #dcdcdc;
            margin-bottom: 20px;
        }
        .stats {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
        }
        #logContainer {
            width: 100%;
            height: 250px;
            overflow-y: scroll;
            border: 2px solid #000000;
            background-color: #cccccc;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            box-sizing: border-box;
        }
        .log-entry { margin-bottom: 5px; border-bottom: 1px dashed #000000; padding-bottom: 2px; }
        .success { font-weight: bold; }
        .error { font-weight: bold; text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #000000; padding: 6px; text-align: left; }
        th { background-color: #b3b3b3; }
        button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #a6a6a6;
            color: #000000;
            border: 2px solid #000000;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
        }
        button:disabled { background-color: #d9d9d9; cursor: not-allowed; border-style: dashed; }
        .success-box {
            background-color: #ccffcc;
            border: 2px solid #000000;
            padding: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>NSE PWA Downloader</h1>
    
    <div class="success-box">
        Routing data securely through the custom Python API bridge.
    </div>

    <div id="dashboard">
        <div class="stats">
            <span>Total Indices: <span id="totalCount">0</span></span>
            <span>Processed: <span id="processedCount">0</span></span>
            <span>Success: <span id="successCount">0</span></span>
            <span>Failed: <span id="failedCount">0</span></span>
        </div>
        <button id="startBtn" onclick="startDownload()">Start Data Extraction</button>
        <button id="downloadBtn" onclick="downloadCSV()" disabled>Download Final CSV</button>
    </div>

    <h2>Live Logs</h2>
    <div id="logContainer"></div>

    <h2>Extraction Status</h2>
    <table id="statusTable">
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Fetch</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('ServiceWorker registration successful');
                }).catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }

        // Add all 258 indices to this array
        const indices = [
            "NIFTY 50", "NIFTY NEXT 50", "NIFTY BANK", "NIFTY IT", "NIFTY AUTO"
        ];

        let processed = 0;
        let success = 0;
        let failed = 0;
        let finalCSVData = "Symbol,Timeframe,Date,Open,High,Low,Close,Volume\n";

        document.getElementById('totalCount').innerText = indices.length;

        function logMessage(message, type = "normal") {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function updateStats() {
            document.getElementById('processedCount').innerText = processed;
            document.getElementById('successCount').innerText = success;
            document.getElementById('failedCount').innerText = failed;
            
            if (processed === indices.length) {
                document.getElementById('downloadBtn').disabled = false;
                document.getElementById('startBtn').disabled = true;
                logMessage("All tasks completed. Ready for CSV download.", "success");
            }
        }

        function updateTableRow(symbol, fetchStatus, aggStatus) {
            let row = document.getElementById(`row-${symbol.replace(/\s+/g, '-')}`);
            if (!row) {
                const tableBody = document.getElementById('tableBody');
                row = document.createElement('tr');
                row.id = `row-${symbol.replace(/\s+/g, '-')}`;
                row.innerHTML = `<td>${symbol}</td><td class="fetch-col">${fetchStatus}</td><td class="agg-col">${aggStatus}</td>`;
                tableBody.appendChild(row);
            } else {
                row.querySelector('.fetch-col').innerText = fetchStatus;
                row.querySelector('.agg-col').innerText = aggStatus;
            }
        }

        function formatDate(date) {
            let d = date.getDate().toString().padStart(2, '0');
            let m = (date.getMonth() + 1).toString().padStart(2, '0');
            let y = date.getFullYear();
            return `${d}-${m}-${y}`;
        }

        function getWeekIdentifier(dateStr) {
            const d = new Date(dateStr);
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return `${d.getUTCFullYear()}-W${weekNo.toString().padStart(2, '0')}`;
        }

        function getMonthIdentifier(dateStr) {
            const d = new Date(dateStr);
            return `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}`;
        }

        function aggregateOHLC(symbol, rawData) {
            rawData.sort((a, b) => new Date(a.date) - new Date(b.date));
            let weeklyData = {};
            let monthlyData = {};

            rawData.forEach(row => {
                if(!row.open || !row.close) return;
                let open = parseFloat(row.open);
                let high = parseFloat(row.high);
                let low = parseFloat(row.low);
                let close = parseFloat(row.close);
                let volume = parseFloat(row.volume || row.sharesTraded || 0);
                
                let weekKey = getWeekIdentifier(row.date);
                let monthKey = getMonthIdentifier(row.date);

                if (!weeklyData[weekKey]) {
                    weeklyData[weekKey] = { date: row.date, open: open, high: high, low: low, close: close, volume: volume };
                } else {
                    weeklyData[weekKey].high = Math.max(weeklyData[weekKey].high, high);
                    weeklyData[weekKey].low = Math.min(weeklyData[weekKey].low, low);
                    weeklyData[weekKey].close = close;
                    weeklyData[weekKey].volume += volume;
                }

                if (!monthlyData[monthKey]) {
                    monthlyData[monthKey] = { date: row.date, open: open, high: high, low: low, close: close, volume: volume };
                } else {
                    monthlyData[monthKey].high = Math.max(monthlyData[monthKey].high, high);
                    monthlyData[monthKey].low = Math.min(monthlyData[monthKey].low, low);
                    monthlyData[monthKey].close = close;
                    monthlyData[monthKey].volume += volume;
                }
            });

            for (let week in weeklyData) {
                let w = weeklyData[week];
                finalCSVData += `${symbol},Weekly,${w.date},${w.open.toFixed(2)},${w.high.toFixed(2)},${w.low.toFixed(2)},${w.close.toFixed(2)},${w.volume}\n`;
            }

            for (let month in monthlyData) {
                let m = monthlyData[month];
                finalCSVData += `${symbol},Monthly,${m.date},${m.open.toFixed(2)},${m.high.toFixed(2)},${m.low.toFixed(2)},${m.close.toFixed(2)},${m.volume}\n`;
            }
        }

        async function fetchIndexData(symbol) {
            updateTableRow(symbol, "Fetching...", "Pending");
            logMessage(`Requesting data for ${symbol} through custom API...`);

            let today = new Date();
            let lastYear = new Date();
            lastYear.setFullYear(today.getFullYear() - 1);

            let toDate = formatDate(today);
            let fromDate = formatDate(lastYear);
            
            // Your Live Render URL is integrated here
            const YOUR_BACKEND_URL = "https://backtesting-8sa9.onrender.com/api/fetch_nse";
            
            let apiUrl = `${YOUR_BACKEND_URL}?symbol=${encodeURIComponent(symbol)}&from=${fromDate}&to=${toDate}`;

            try {
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`API Error ${response.status}`);
                }

                const data = await response.json();
                
                if (data && data.data && data.data.length > 0) {
                    updateTableRow(symbol, "Success", "Aggregating...");
                    aggregateOHLC(symbol, data.data);
                    updateTableRow(symbol, "Success", "Complete");
                    logMessage(`${symbol} processing complete.`, "success");
                    success++;
                } else {
                    throw new Error(data.error || "No data returned.");
                }

            } catch (error) {
                updateTableRow(symbol, "Failed", "Skipped");
                logMessage(`Error fetching ${symbol}: ${error.message}`, "error");
                failed++;
            }

            processed++;
            updateStats();
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function startDownload() {
            document.getElementById('startBtn').disabled = true;
            logMessage("Starting extraction via Custom API Bridge...");

            for (let i = 0; i < indices.length; i++) {
                await fetchIndexData(indices[i]);
                if (i < indices.length - 1) {
                    await sleep(2000); 
                }
            }
        }

        function downloadCSV() {
            const blob = new Blob([finalCSVData], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', 'NSE_PWA_OHLC.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            logMessage("CSV file downloaded to your device.", "success");
        }
    </script>
</body>
</html>
